<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المعجم المهري</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <img src="logo.png" alt="شعار المعجم المهري" class="logo">

        <h1>المعجم المهري</h1>

        <p class="subtitle">
            النسخة الخاصة بمركز اللغة المهرية للدراسات والبحوث
        </p>

        <input
            type="text"
            id="username"
            placeholder="اسم المستخدم">

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور">

        <button id="loginBtn">
            تسجيل الدخول
        </button>

        <footer>
            © مركز اللغة المهرية للدراسات والبحوث ـ جامعة المهرة
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
