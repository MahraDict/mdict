<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | المعجم المهري</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div id="app">

        <div class="login-box">
            <h1>المعجم المهري</h1>

            <p>تسجيل الدخول</p>

            <form>

                <input
                    type="text"
                    placeholder="اسم المستخدم"
                >

                <input
                    type="password"
                    placeholder="كلمة المرور"
                >

                <button type="submit">
                    دخول
                </button>

            </form>

        </div>

    </div>

    <script src="../assets/js/app.js"></script>

</body>
</html>
